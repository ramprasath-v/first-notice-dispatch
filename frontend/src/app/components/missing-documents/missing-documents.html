<section class="missing-panel" aria-labelledby="missing-title">
  <p class="kicker">Action needed</p>
  <h2 id="missing-title">More information needed</h2>
  <p class="lead">1 item needed to continue</p>
  <div class="missing-list">
    @for (request of requests; track key(request)) {
      <article class="missing-item">
        <div><strong>{{ request.instruction }}</strong><small>{{ request.label }}</small></div>
        <label class="secondary file-button" [class.disabled]="uploading || processing">
          <input type="file" accept="image/jpeg,image/png,application/pdf" (change)="choose(request, $event)" />
          {{ selected()[key(request)]?.file?.name || 'Choose file' }}
        </label>
        <button class="primary compact" type="button" [disabled]="!selected()[key(request)] || uploading || processing" (click)="upload(request)">
          {{ uploading ? 'Uploading…' : processing ? 'Rechecking…' : 'Upload' }}
        </button>
      </article>
    }
  </div>
  <p class="lead">FirstNotice will automatically continue processing when this item is received.</p>
</section>
